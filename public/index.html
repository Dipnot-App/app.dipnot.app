  <body>
    <div class="ocean" aria-hidden="true">

    <main class="card glass">

        width="88"

      />
      <h1>Dipnot</h1>
      <p class="tagline">Dipnot uygulamasına yönlendiriliyorsun…</p>
      <div class="actions">
        <a
          id="store-ios"
          class="btn btn--store glass"
          href="https://apps.apple.com/app/id6757102330"
          hidden
        >
          <svg
            class="store-icon"
            viewBox="0 0 384 512"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
            />
          </svg>
          <span class="store-label"><small>İndir</small><span>App Store</span></span>
        </a>
        <a
          id="store-android"
          class="btn btn--store glass"
          href="https://play.google.com/store/apps/details?id=com.vacstudio.dipnot"
          hidden
        >
          <img
            class="store-icon"
            src="/assets/google-play.svg"
            alt=""
            width="28"
            height="28"
          />
          <span class="store-label"><small>İndir</small><span>Google Play</span></span>
        </a>
        <a href="https://dipnot.app" class="link">dipnot.app'a git &rsaquo;</a>
      </div>
      <p class="footer">&copy; Dipnot</p>
    </main>

    <script>
      // app.dipnot.app is the app's front door. Send every visitor to the
      // app itself, or to the right store when it isn't installed:
      //
      // - Installed users who *tap* an app.dipnot.app link from another app
      //   never reach this page — Universal Links (iOS, AASA paths `*`) /
      //   verified App Links (Android, assetlinks.json) open the app first.
      // - This page is the fallback for the rest: a directly-typed URL, an
      //   in-app browser (Instagram/Twitter) that ignores UL, or a copy-paste
      //   into a new tab. For those we try the `dipnotapp://` scheme (opens
      //   the app if installed) and, failing that, redirect to the platform
      //   store. Desktop just shows the store buttons — custom-scheme nav
      //   there only pops an OS prompt.
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);

        var IOS_STORE = "https://apps.apple.com/app/id6757102330";
        var ANDROID_STORE =
          "https://play.google.com/store/apps/details?id=com.vacstudio.dipnot";

        var iosBtn = document.getElementById("store-ios");
        var androidBtn = document.getElementById("store-android");

        // Desktop: no scheme attempt, no auto-redirect. Show *both* store
        // buttons so the visitor can pick their platform, and break the
        // tagline onto two lines.
        var storeUrl = isIOS ? IOS_STORE : isAndroid ? ANDROID_STORE : null;
        if (!storeUrl) {
          iosBtn.hidden = false;
          androidBtn.hidden = false;
          // Static string (no user input) — innerHTML is safe here and lets
          // the line break through.
          document.querySelector(".tagline").innerHTML =
            "Dipnot mobil uygulaması <br> App Store ve Google Play'de.";
          return;
        }

        // Mobile: reveal only the matching platform's button as a visible,
        // tappable fallback if the auto-redirect is blocked.
        (isIOS ? iosBtn : androidBtn).hidden = false;

        // why: if the page becomes hidden the OS handed off to the app —
        // bail so we don't bounce the user to the store on their return.
        var handedOff = false;
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) handedOff = true;
        });

        // Try to open the installed app first…
        window.location.href = "dipnotapp://";

        // …then fall through to the store. The delay lets an installed app
        // take over (which hides the page and sets `handedOff`); if nothing
        // claims the scheme we land on the store.
        setTimeout(function () {
          if (!handedOff) window.location.href = storeUrl;
        }, 1200);
      })();
    </script>
  </body>

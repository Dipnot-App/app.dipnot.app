<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dipnot</title>
    <meta
      name="description"
      content="Dipnot mobil uygulamasında kürate edilmiş içeriği keşfet."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dipnot" />
    <meta property="og:title" content="Dipnot" />
    <meta
      property="og:description"
      content="Dipnot mobil uygulamasında kürate edilmiş içeriği keşfet."
    />
    <meta property="og:url" content="https://app.dipnot.app/" />
    <meta property="og:image" content="https://app.dipnot.app/og-image.svg" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dipnot" />
    <meta
      name="twitter:description"
      content="Dipnot mobil uygulamasında kürate edilmiş içeriği keşfet."
    />
    <meta name="twitter:image" content="https://app.dipnot.app/og-image.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #131b26;
        --accent: #6ad0e3;
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.68);
        --text-subtle: rgba(255, 255, 255, 0.45);
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 420px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .logo {
        width: 96px;
        height: 96px;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .tagline {
        font-size: 16px;
        color: var(--text-muted);
        max-width: 320px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 120ms ease, opacity 120ms ease;
        min-width: 220px;
      }

      .cta-primary {
        background: var(--accent);
        color: var(--bg);
      }

      .cta-primary:hover {
        transform: translateY(-1px);
      }

      .cta-primary:active {
        transform: translateY(0);
        opacity: 0.9;
      }

      .footer {
        margin-top: 16px;
        font-size: 13px;
        color: var(--text-subtle);
      }

      .footer a {
        color: var(--text-muted);
        text-decoration: none;
      }

      .footer a:hover {
        color: var(--accent);
      }

      @media (prefers-reduced-motion: reduce) {
        .cta-primary:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <img src="/assets/logo-white.svg" alt="Dipnot logo" class="logo" />
      <h1>Dipnot</h1>
      <p class="tagline">Dipnot uygulamasına yönlendiriliyorsun…</p>
      <div class="actions">
        <a
          id="store-ios"
          class="cta cta-primary"
          href="https://apps.apple.com/app/id6757102330"
          hidden
          >App Store'dan indir</a
        >
        <a
          id="store-android"
          class="cta cta-primary"
          href="https://play.google.com/store/apps/details?id=com.vacstudio.dipnot"
          hidden
          >Google Play'den indir</a
        >
        <a href="https://dipnot.app" class="cta cta-secondary"
          >dipnot.app'a git</a
        >
      </div>
      <p class="footer">&copy; Dipnot</p>
    </main>

    <script>
      // app.dipnot.app is the app's front door. Send every visitor to the
      // app itself, or to the right store when it isn't installed:
      //
      // - Installed users who *tap* an app.dipnot.app link from another app
      //   never reach this page — Universal Links (iOS, AASA paths `*`) /
      //   verified App Links (Android, assetlinks.json) open the app first.
      // - This page is the fallback for the rest: a directly-typed URL, an
      //   in-app browser (Instagram/Twitter) that ignores UL, or a copy-paste
      //   into a new tab. For those we try the `dipnotapp://` scheme (opens
      //   the app if installed) and, failing that, redirect to the platform
      //   store. Desktop just shows the store buttons — custom-scheme nav
      //   there only pops an OS prompt.
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);

        var IOS_STORE = "https://apps.apple.com/app/id6757102330";
        var ANDROID_STORE =
          "https://play.google.com/store/apps/details?id=com.vacstudio.dipnot";

        // Reveal the matching store button so there's always a visible,
        // tappable fallback if the auto-redirect is blocked.
        var storeUrl = isIOS ? IOS_STORE : isAndroid ? ANDROID_STORE : null;
        var btn = document.getElementById(isIOS ? "store-ios" : "store-android");
        if (btn) btn.hidden = false;

        // Desktop: no scheme attempt, no auto-redirect — the tagline +
        // buttons stand on their own.
        if (!storeUrl) {
          document.querySelector(".tagline").textContent =
            "Dipnot mobil uygulaması App Store ve Google Play'de.";
          return;
        }

        // why: if the page becomes hidden the OS handed off to the app —
        // bail so we don't bounce the user to the store on their return.
        var handedOff = false;
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) handedOff = true;
        });

        // Try to open the installed app first…
        window.location.href = "dipnotapp://";

        // …then fall through to the store. The delay lets an installed app
        // take over (which hides the page and sets `handedOff`); if nothing
        // claims the scheme we land on the store.
        setTimeout(function () {
          if (!handedOff) window.location.href = storeUrl;
        }, 1200);
      })();
    </script>
  </body>
</html>

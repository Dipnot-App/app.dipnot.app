  <body>
    <div class="ocean" aria-hidden="true">

    <main class="card glass">

      <h1>Dipnot</h1>
      <p class="tagline">
        Bu makale Dipnot uygulamasında. Uygulamayı indirerek içeriği tam olarak

      </p>
      <div class="actions">
        <a
          id="open-in-app"
          class="btn btn--primary"
          href="#"
          hidden
          aria-label="Makaleyi Dipnot uygulamasında aç"
          >Uygulamada aç</a
        >
        <a
          id="store-ios"
          class="btn btn--store glass"
          href="https://apps.apple.com/app/id6757102330"
        >
          <svg
            class="store-icon"
            viewBox="0 0 384 512"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
            />
          </svg>
          <span class="store-label"><small>İndir</small><span>App Store</span></span>
        </a>
        <a
          id="store-android"
          class="btn btn--store glass"
          href="https://play.google.com/store/apps/details?id=com.vacstudio.dipnot"
        >
          <img
            class="store-icon"
            src="/assets/google-play.svg"
            alt=""
            width="28"
            height="28"
          />
          <span class="store-label"><small>İndir</small><span>Google Play</span></span>
        </a>
        <a href="https://dipnot.app" class="link">dipnot.app'a git &rsaquo;</a>
      </div>
      <p class="footer">&copy; Dipnot</p>
    </main>

    <script>
      // The fallback for an app.dipnot.app/article/<id> link. Universal
      // Links / App Links route installed users straight into the app; this
      // page serves everyone else: people without the app, and in-app
      // browsers that ignore Universal Links (Instagram, X), long-pressed or
      // pasted links. Both store buttons render without JS, so desktop and
      // no-JS visitors get a working page.
      (function () {
        // why: only the three campaign keys travel on (DipnotAPP #742). The
        // app reads them into `article_open`; anything else on the link is
        // not ours to forward.
        var params = new URLSearchParams(window.location.search);
        var utm = new URLSearchParams();
        ["utm_source", "utm_medium", "utm_campaign"].forEach(function (k) {
          var v = params.get(k);
          if (v) utm.set(k, v);
        });
        var utmQuery = utm.toString();

        // why: the stores keep the campaign through an install. Play passes
        // `referrer` to the Install Referrer, which Firebase Analytics reads
        // on first open, so `first_open` carries the campaign in GA. The
        // App Store's `ct` (40 characters max) shows only in App Store
        // Connect; a reader share has no campaign, so its source stands in.
        if (utmQuery) {
          var android = document.getElementById("store-android");
          android.href += "&referrer=" + encodeURIComponent(utmQuery);
          var ct = utm.get("utm_campaign") || utm.get("utm_source");
          if (ct) {
            var ios = document.getElementById("store-ios");
            ios.href += "?ct=" + encodeURIComponent(ct.slice(0, 40));
          }
        }

        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var m = window.location.pathname.match(/^\/article\/([^\/?#]+)/);
        if (!m || (!isIOS && !isAndroid)) return;

        // Mobile: show the "open in app" button, and only the matching
        // platform's store button. On desktop the custom scheme either
        // no-ops or pops an OS prompt, so only the store buttons show.
        var deepLink = "dipnotapp://article/" + m[1] + (utmQuery ? "?" + utmQuery : "");
        var btn = document.getElementById("open-in-app");
        btn.setAttribute("href", deepLink);
        btn.hidden = false;
        document.getElementById(isIOS ? "store-android" : "store-ios").hidden =
          true;

        // why: if the page becomes hidden the OS handed off to the app, so
        // don't re-attempt when the user comes back.
        var handedOff = false;
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) handedOff = true;
        });

        // why: small delay so the page paints once first. If the app isn't
        // installed the scheme navigation silently fails and the visitor
        // stays here with the store button in view.
        setTimeout(function () {
          if (!handedOff) window.location.href = deepLink;
        }, 150);
      })();
    </script>
  </body>

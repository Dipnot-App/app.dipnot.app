<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dipnot</title>
    <meta
      name="description"
      content="Bu makaleyi Dipnot uygulamasında oku."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Dipnot" />
    <meta property="og:title" content="Dipnot" />
    <meta
      property="og:description"
      content="Bu makaleyi Dipnot uygulamasında oku."
    />
    <meta property="og:url" content="https://app.dipnot.app/" />
    <meta property="og:image" content="https://app.dipnot.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dipnot logosu" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dipnot" />
    <meta
      name="twitter:description"
      content="Bu makaleyi Dipnot uygulamasında oku."
    />
    <meta name="twitter:image" content="https://app.dipnot.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#338596" />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <div class="ocean" aria-hidden="true">
      <div class="ocean__rays"></div>
      <div class="ocean__glow ocean__glow--a"></div>
      <div class="ocean__glow ocean__glow--b"></div>
    </div>
    <main class="card glass">
      <img
        src="/assets/app-icon.svg"
        alt=""
        class="app-icon"
        width="88"
        height="88"
      />
      <h1>Dipnot</h1>
      <p class="tagline">
        Bu makale Dipnot uygulamasında. Uygulamayı indirerek içeriği tam olarak
        okuyabilirsin.
      </p>
      <div class="actions">
        <a
          id="open-in-app"
          class="btn btn--primary"
          href="#"
          hidden
          aria-label="Makaleyi Dipnot uygulamasında aç"
          >Uygulamada aç</a
        >
        <a href="https://dipnot.app" class="link">dipnot.app'a git &rsaquo;</a>
      </div>
      <p class="footer">&copy; Dipnot</p>
    </main>

    <script>
      // Show the "Open in app" button when we're on an /article/<id> path,
      // and auto-attempt the deep link on mobile. Universal Links / App
      // Links should already route installed users straight into the app —
      // this page is the fallback for cases where that routing fails (e.g.
      // Twitter in-app browser, long-pressed link, copy-paste into a new
      // tab). The button stays as a backup if the auto-redirect no-ops.
      (function () {
        var m = window.location.pathname.match(/^\/article\/([^\/?#]+)/);
        var btn = document.getElementById("open-in-app");
        if (!m || !btn) return;

        var deepLink = "dipnotapp://article/" + m[1];
        btn.setAttribute("href", deepLink);
        btn.hidden = false;

        // why: only auto-redirect on mobile. On desktop, custom-scheme
        // navigation either no-ops or pops an OS prompt that's worse than
        // just letting the user click the button.
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (!isMobile) return;

        // why: if the page becomes hidden, the OS handed off to the app —
        // bail so we don't re-attempt when the user comes back.
        var handedOff = false;
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) handedOff = true;
        });

        // why: small delay so the fallback page paints once before we try
        // the scheme. If the app isn't installed the navigation silently
        // fails and the user is left looking at this page.
        setTimeout(function () {
          if (handedOff) return;
          window.location.href = deepLink;
        }, 150);
      })();
    </script>
  </body>
</html>

    <script>
      // The competition's shareable link. Installed users who *tap* an
      // app.dipnot.app/yarisma-2026 link open the app directly (Universal
      // Links / App Links, plus the app's /yarisma-2026 route alias), so
      // they never see this page. It serves everyone else: people without
      // the app, in-app browsers that ignore Universal Links, get.dipnot.app
      // (not an app-link domain), and every link-preview crawler.
      //
      // why no store auto-redirect, unlike index.html: this page carries
      // content (what the competition is, the rules link), so we leave the
      // choice to the visitor. Both store buttons render without JS, so
      // desktop and no-JS visitors get a working page.
      //
      // why `dipnotapp://competition` and not `/yarisma-2026`: the
      // `competition` route ships in every 1.6.x binary, so the scheme works
      // even on a bundle that predates the alias.
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        if (!isIOS && !isAndroid) return;

        // Mobile: show the "open in app" button, and only the matching
        // platform's store button.
        document.getElementById("open-in-app").hidden = false;
        document.getElementById(isIOS ? "store-android" : "store-ios").hidden =
          true;

        // why: if the page becomes hidden the OS handed off to the app, so
        // don't re-attempt when the user comes back.
        var handedOff = false;
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) handedOff = true;
        });

        // why: small delay so the page paints once first. If the app isn't
        // installed the scheme navigation silently fails and the visitor
        // stays here with the store button in view.
        setTimeout(function () {
          if (!handedOff) window.location.href = "dipnotapp://competition";
        }, 150);
      })();
    </script>
